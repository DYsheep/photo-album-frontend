<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA：可安装到主屏幕 + 主题色（与导航栏一致） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="摄影相册" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- 站点默认分享卡片：后端渲染 /share/{code} 时会整体替换下面标记之间的内容 -->
    <!-- share-card:start -->
    <title>摄影相册 - Photo Album</title>
    <meta name="description" content="光影记录 · 摄影作品展示与分享" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="摄影相册" />
    <meta property="og:title" content="摄影相册 - Photo Album" />
    <meta property="og:description" content="光影记录 · 摄影作品展示与分享" />
    <meta property="og:url" content="https://www.dyframe.art/" />
    <meta property="og:image" content="https://www.dyframe.art/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="摄影相册 - Photo Album" />
    <meta name="twitter:description" content="光影记录 · 摄影作品展示与分享" />
    <meta name="twitter:image" content="https://www.dyframe.art/icons/icon-512.png" />
    <!-- share-card:end -->
    <!-- DNS 预解析 + TLS 预连接，减少 COS 图片加载延迟 -->
    <link rel="dns-prefetch" href="https://photo-album-1306350779.cos.ap-hongkong.myqcloud.com" />
    <link rel="preconnect" href="https://photo-album-1306350779.cos.ap-hongkong.myqcloud.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
